<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover">
  <meta name="theme-color" content="#f7f7f5">
  <title>Weeple AI OS — Your Personal Universe</title>
  <link rel="stylesheet" href="src/shared/styles/tokens.css">
  <link rel="stylesheet" href="src/shared/styles/base.css">
  <link rel="stylesheet" href="src/shared/styles/shell.css">
</head>
<body>
  <div class="ambient ambient-one"></div>
  <div class="ambient ambient-two"></div>

  <main class="os-shell">
<header class="topbar">
      <button class="brand" type="button" data-home aria-label="Return to overview">
        <span class="brand-mark"><img src="logo.png" alt=""></span>
        <span class="brand-copy">
          <strong>Weeple</strong>
          <small>PERSONAL AI OS</small>
        </span>
      </button>

      <nav class="primary-nav" aria-label="Primary navigation">
        <button class="nav-item active" type="button" data-route="overview">Overview</button>
        <button class="nav-item" type="button" data-route="goals">Goals</button>
        <button class="nav-item" type="button" data-route="import-data">Import Data</button>
        <button class="nav-item" type="button" data-route="use-data">Use Data</button>
      </nav>

      <div class="system-actions">
        <div class="device-clock" aria-label="Current local time and date">
          <strong id="deviceTime">09:42</strong>
          <span id="deviceDate">Friday, Jul 31</span>
        </div>
        <button class="weather-chip" id="weatherChip" type="button" aria-label="Current weather">
          <span class="weather-icon" id="weatherIcon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19m0-14-1.5 1.5m-11 11L5 19"/></svg>
          </span>
          <span><strong id="weatherTemperature">--°</strong><small id="weatherCondition">Loading</small></span>
        </button>
        <button class="example-profile-button" id="setupButton" type="button" aria-label="Open first value setup">
          <i></i><span>Example profile</span>
        </button>
        <button class="icon-button" id="searchButton" type="button" aria-label="Open AI search" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 21-4.4-4.4m2.4-5.1a7.5 7.5 0 1 1-15 0 7.5 7.5 0 0 1 15 0Z"/></svg>
        </button>
        <button class="icon-button" id="voiceButton" type="button" aria-label="Start AI voice" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21m-3 0h6"/></svg>
        </button>
        <button class="icon-button notice-button" id="noticeButton" type="button" aria-label="Open notifications" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 8.5h18C21 16 18 16 18 9ZM10 21h4"/></svg>
          <span class="notice-dot"></span>
        </button>
        <button class="icon-button" id="settingsButton" type="button" aria-label="Open system settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1a1.7 1.7 0 0 0 1.9.3A1.7 1.7 0 0 0 10 3V2.8h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1Z"/></svg>
        </button>
        <div class="online-pill"><i></i><span>Online</span></div>
      </div>
    </header>

    <div id="page-outlet" class="page-outlet" aria-live="polite"></div>

<section class="command-panel" id="commandPanel" aria-label="AI command center">
        <div class="command-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 21-4.4-4.4m2.4-5.1a7.5 7.5 0 1 1-15 0 7.5 7.5 0 0 1 15 0Z"/></svg>
        </div>
        <input id="commandInput" type="text" placeholder="Ask Weeple anything…" autocomplete="off">
        <kbd>ESC</kbd>
      </section>

<aside class="notification-panel" id="notificationPanel" aria-label="Notifications">
        <div class="panel-heading"><strong>Action center</strong><span>3 updates</span></div>
        <button type="button" data-notification-action="Review today’s goal plan"><i class="priority-important"></i><span><em>Important</em><b>Morning brief is ready</b><small>3 goals prioritized for today</small></span><time>Now</time></button>
        <button type="button" data-notification-action="Open meeting preparation"><i class="priority-progress"></i><span><em>In progress</em><b>Meeting preparation</b><small>AI is assembling the final context</small></span><time>2m</time></button>
        <button type="button" data-notification-action="View synchronized sources"><i class="priority-completed"></i><span><em>Completed</em><b>Health data synced</b><small>Apple Fitness · 42 metrics</small></span><time>8m</time></button>
      </aside>

<section class="activity-dock" aria-label="Live AI activity ledger">
      <div class="activity-identity">
        <span class="activity-symbol">
          <i></i>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v3m0 12v3M3 12h3m12 0h3M5.6 5.6l2.1 2.1m8.6 8.6 2.1 2.1m0-12.8-2.1 2.1m-8.6 8.6-2.1 2.1"/></svg>
        </span>
        <span><small>EXAMPLE DATA</small><strong>AI Activity</strong><em>Continuously learning</em></span>
      </div>
      <div class="activity-feed">
        <button class="activity-item priority status-progress" type="button" data-activity-action="Review plan" data-action-target="goals" aria-label="Goal plan recalibrated. In progress. Touch to reveal Review plan action.">
          <span class="activity-dot"><i></i></span>
          <span><strong id="liveActivityTitle">Goal plan recalibrated</strong><small id="liveActivityDetail">3 next actions prioritized for today</small><em class="activity-action">Review plan <b>→</b></em></span>
          <span class="activity-meta"><time>Now</time><em>In progress</em></span>
        </button>
        <button class="activity-item status-important" type="button" data-activity-action="Open preparation" data-action-target="calendar" aria-label="Client Meeting at 14:00. Important. Touch to reveal Open preparation action.">
          <span class="activity-dot amber"><i></i></span>
          <span><strong>Client Meeting · 14:00</strong><small>Agenda, notes, and documents are ready</small><em class="activity-action">Open preparation <b>→</b></em></span>
          <span class="activity-meta"><time>2h</time><em>Important</em></span>
        </button>
        <button class="activity-item status-completed" type="button" data-activity-action="View sources" data-action-target="data" aria-label="Personal data synchronized. Completed. Touch to reveal View sources action.">
          <span class="activity-dot violet"><i></i></span>
          <span><strong>Personal data synchronized</strong><small>42 new signals connected securely</small><em class="activity-action">View sources <b>→</b></em></span>
          <span class="activity-meta"><time>8m</time><em>Completed</em></span>
        </button>
        <button class="activity-item status-progress" type="button" data-activity-action="View insight" data-action-target="memory" aria-label="Memory insight prepared. In progress. Touch to reveal View insight action.">
          <span class="activity-dot coral"><i></i></span>
          <span><strong>Memory insight prepared</strong><small>6 relevant notes linked to today’s goals</small><em class="activity-action">View insight <b>→</b></em></span>
          <span class="activity-meta"><time>12m</time><em>In progress</em></span>
        </button>
      </div>
      <button class="activity-expand" id="activityExpand" type="button" aria-label="View all notifications">
        <span>View all</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-5-5 5 5-5 5"/></svg>
      </button>
    </section>
  </main>

<section class="onboarding-overlay" id="onboardingOverlay" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="onboardingTitle">
    <div class="onboarding-card">
      <button class="onboarding-close" id="onboardingClose" type="button" aria-label="Close first value setup"><svg viewBox="0 0 24 24"><path d="m7 7 10 10M17 7 7 17"/></svg></button>
      <header><span><i></i>FIRST VALUE SETUP</span><small id="onboardingProgressLabel">STEP 1 OF 4</small><h2 id="onboardingTitle">What would be useful first?</h2><p id="onboardingDescription">Choose one outcome. Weeple will request only the minimum data needed to produce a real, verifiable result.</p></header>
      <div class="onboarding-progress"><i></i><i></i><i></i><i></i></div>
      <div class="onboarding-body" id="onboardingBody"></div>
      <footer><button id="onboardingBack" type="button">Back</button><button class="onboarding-next" id="onboardingNext" type="button">Continue</button></footer>
    </div>
  </section>

  <div class="toast" id="toast" role="status"><i></i><span>Goals hub focused</span><button id="toastAction" type="button" hidden>Undo</button></div>
  <script type="module" src="src/app/bootstrap.js"></script>
</body>
</html>
