services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: weeple
      POSTGRES_PASSWORD: weeple
      POSTGRES_DB: weeple
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weeple"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env.example
    environment:
      DATABASE_URL: postgresql+psycopg://weeple:weeple@postgres:5432/weeple
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      USE_DATABASE: "true"
      USE_MOCK_DATA: "false"
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: weeple
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app:ro

  # Placeholder services — replace with real images when adapters are wired
  nango:
    image: nginx:alpine
    ports:
      - "3003:80"

  memory:
    image: nginx:alpine
    ports:
      - "8081:80"

  agent-harness:
    image: nginx:alpine
    ports:
      - "8082:80"

  astrbot:
    image: nginx:alpine
    ports:
      - "8083:80"

  mcp-gateway:
    image: nginx:alpine
    ports:
      - "8080:80"

volumes:
  postgres_data:
